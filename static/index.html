<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live2Dマスコット連携</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 24px; line-height: 1.8; color: #23303b; background: #f6f8fa; }
    main { background: white; padding: 24px; border-radius: 12px; }
    button { padding: 8px 16px; cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Live2Dマスコット連携</h1>
    <p>開発準備版です。コメント受信の入口と設定の初期値を用意しています。読み上げ送信、設定変更・保存は未実装です。</p>
    <button id="refresh" type="button">状態を取得</button>
    <pre id="status" aria-live="polite">わんコメからこの画面を開いてください。</pre>
  </main>
  <script>
    document.getElementById('refresh').addEventListener('click', async () => {
      const output = document.getElementById('status');
      try {
        const response = await fetch('/api/plugins/com.onecomme.live2d-mascot');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        output.textContent = JSON.stringify(await response.json(), null, 2);
      } catch {
        output.textContent = '状態を取得できませんでした。わんコメの起動とプラグインの有効化を確認してください。';
      }
    });
  </script>
</body>
</html>
